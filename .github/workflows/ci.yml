name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - name: CLI smoke test
        run: |
          ./bin/untangle.js --list-modules
          ./bin/untangle.js samples/obfuscated.js -o /tmp/static.js
          grep -q "_0x4f1e(" /tmp/static.js        # static default: decoders untouched
          ./bin/untangle.js --dyn --stats samples/obfuscated.js -o /tmp/out.js
          ! grep -q "_0x4f1e" /tmp/out.js
